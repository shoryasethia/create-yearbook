services:
  - type: web
    name: create-yearbook
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm install && npm run build:css
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 1 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_DEBUG
        value: "0"
      - key: GITHUB_REPO
        value: https://github.com/shoryasethia/create-yearbook
      - key: SECRET_KEY
        generateValue: true
