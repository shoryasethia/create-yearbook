<div id="wake-overlay" role="alertdialog" aria-live="assertive" aria-label="Backend starting"
     class="fixed inset-0 z-[200] hidden flex items-center justify-center bg-canvas p-6 dark:bg-canvas-dark">
  <div class="w-full max-w-sm rounded-2xl border border-line bg-panel p-8 text-center dark:border-line-dark dark:bg-panel-dark">
    <div class="mx-auto mb-4 h-8 w-8 animate-spin rounded-full border-2 border-zinc-200 border-t-zinc-600 dark:border-zinc-600 dark:border-t-zinc-300" aria-hidden="true"></div>
    <h2 class="text-lg font-semibold text-zinc-900 dark:text-zinc-50">Backend is waking up</h2>
    <p id="wake-message" class="mt-3 text-sm leading-relaxed text-zinc-500 dark:text-zinc-400">
      Because of no traffic, the backend was asleep. It is restarting now — please stay on this page and wait up to 2 minutes.
    </p>
    <p class="mt-4 text-xs text-zinc-400 dark:text-zinc-500">This page will load automatically once the server is ready.</p>
  </div>
</div>
