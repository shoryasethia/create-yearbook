<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starting up…</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" type="image/png">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body class="standalone-page">
  <div class="standalone-card max-w-sm">
    <div class="standalone-card-inner">
    <div class="mx-auto mb-4 h-8 w-8 animate-spin rounded-full border-2 border-zinc-200 border-t-zinc-600 dark:border-zinc-600 dark:border-t-zinc-300" aria-hidden="true"></div>
    <h1 class="text-lg font-semibold">Backend is waking up</h1>
    <p id="wake-message" class="mt-3 text-sm leading-relaxed text-zinc-500 dark:text-zinc-400">
      Because of no traffic, the backend was asleep. It is restarting now — please wait up to 2 minutes.
    </p>
    <p class="mt-4 text-xs text-zinc-400 dark:text-zinc-500">You will be redirected automatically.</p>
    </div>
  </div>
  <script>
    (function () {
      const POLL_MS = 4000;
      const MAX_ATTEMPTS = 30;

      function sleep(ms) {
        return new Promise(function (resolve) { window.setTimeout(resolve, ms); });
      }

      async function ping() {
        try {
          const r = await fetch("/health", { cache: "no-store", headers: { Accept: "application/json" } });
          if (!r.ok) return false;
          const data = await r.json();
          return data && data.status === "ok";
        } catch (_e) { return false; }
      }

      async function run() {
        for (let i = 0; i < MAX_ATTEMPTS; i += 1) {
          if (await ping()) {
            window.location.replace("{{ url_for('index') }}");
            return;
          }
          await sleep(POLL_MS);
        }
        var msg = document.getElementById("wake-message");
        if (msg) msg.textContent = "Still waking up. Please refresh this page in a minute.";
      }

      run();
    })();
  </script>
</body>
</html>
