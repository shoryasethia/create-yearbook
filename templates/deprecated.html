<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Yearbook — Offline</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" type="image/png">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body class="relative min-h-screen bg-canvas text-zinc-900 dark:bg-canvas-dark dark:text-zinc-100">
  <main class="absolute left-1/2 top-1/2 w-full max-w-md -translate-x-1/2 -translate-y-1/2 px-4">
    <div class="rounded-2xl border border-line bg-panel px-8 py-10 shadow-sm dark:border-line-dark dark:bg-panel-dark">
      <div class="flex flex-col items-center text-center">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="" width="56" height="56" class="app-logo" aria-hidden="true">
      <h1 class="mt-5 text-xl font-semibold tracking-tight text-zinc-900 dark:text-zinc-50">This site is no longer operational</h1>
      <p class="mt-4 max-w-xs text-sm leading-relaxed text-zinc-500 dark:text-zinc-400">
        Create Yearbook has been taken down and exports are disabled. Thanks for using it.
      </p>
      <a href="{{ github_repo }}" target="_blank" rel="noopener noreferrer" class="standalone-btn">
        View on GitHub
      </a>
      </div>
    </div>
  </main>
</body>
</html>
